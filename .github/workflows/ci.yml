name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  dotnet:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore src/dotnet/Actionful.Client.slnx

      - name: Build
        run: dotnet build src/dotnet/Actionful.Client.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/dotnet/Actionful.Client.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/*.trx"

  js:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        working-directory: src/js
        run: npm ci

      - name: Typecheck
        working-directory: src/js
        run: npm run typecheck

      - name: Test
        working-directory: src/js
        run: npm test

      - name: Build
        working-directory: src/js
        run: npm run build

  go:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        working-directory: src/go
        run: go build ./...

      - name: Test
        working-directory: src/go
        run: go test ./... -v -timeout 60s

  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: src/python
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: src/python
        run: python -m pytest tests/ -v
