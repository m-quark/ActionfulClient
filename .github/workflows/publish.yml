name: Publish

on:
  push:
    tags:
      - 'v*'       # triggers NuGet release  e.g. v1.2.0
      - 'npm-v*'   # triggers npm release    e.g. npm-v1.2.0
      - 'go-v*'    # triggers Go release     e.g. go-v1.0.0
      - 'pypi-v*'  # triggers PyPI release   e.g. pypi-v1.0.0

jobs:
  publish-nuget:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore src/dotnet/Actionful.Client.slnx

      - name: Build
        run: dotnet build src/dotnet/Actionful.Client.slnx --no-restore --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test src/dotnet/Actionful.Client.slnx --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/dotnet/Actionful.Client/Actionful.Client.csproj --no-build --configuration Release -p:Version=${{ steps.version.outputs.VERSION }} --output ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-npm:
    if: startsWith(github.ref_name, 'npm-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#npm-v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: src/js
        run: npm ci

      - name: Typecheck
        working-directory: src/js
        run: npm run typecheck

      - name: Test
        working-directory: src/js
        run: npm test

      - name: Build
        working-directory: src/js
        run: npm run build

      - name: Set version
        working-directory: src/js
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

      - name: Publish to npm
        working-directory: src/js
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-go:
    if: startsWith(github.ref_name, 'go-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test
        working-directory: src/go
        run: go test ./... -timeout 60s

      # Go modules are published by the tag itself — pkg.go.dev indexes automatically.
      # This step triggers the proxy to fetch the new version immediately.
      - name: Trigger pkg.go.dev index
        run: |
          VERSION=${GITHUB_REF_NAME#go-v}
          curl -s "https://sum.golang.org/lookup/github.com/m-quark/actionful-client-go@v${VERSION}" || true
          curl -s "https://proxy.golang.org/github.com/m-quark/actionful-client-go/@v/v${VERSION}.info" || true

  publish-pypi:
    if: startsWith(github.ref_name, 'pypi-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#pypi-v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: src/python
        run: pip install -e ".[dev]" build

      - name: Test
        working-directory: src/python
        run: python -m pytest tests/

      - name: Set version
        working-directory: src/python
        run: sed -i "s/^version = .*/version = \"${{ steps.version.outputs.VERSION }}\"/" pyproject.toml

      - name: Build
        working-directory: src/python
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: src/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
