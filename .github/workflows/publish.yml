name: Publish

on:
  push:
    tags:
      - 'v*'       # triggers NuGet release  e.g. v1.2.0
      - 'npm-v*'   # triggers npm release    e.g. npm-v1.2.0
      - 'src/go/v*' # triggers Go release    e.g. src/go/v1.0.0
      - 'pypi-v*'  # triggers PyPI release   e.g. pypi-v1.0.0

jobs:
  publish-nuget:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore src/dotnet/Actionful.Client.slnx

      - name: Build
        run: dotnet build src/dotnet/Actionful.Client.slnx --no-restore --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test src/dotnet/Actionful.Client.slnx --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/dotnet/Actionful.Client/Actionful.Client.csproj --no-build --configuration Release -p:Version=${{ steps.version.outputs.VERSION }} --output ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-npm:
    if: startsWith(github.ref_name, 'npm-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#npm-v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: src/js
        run: npm ci

      - name: Typecheck
        working-directory: src/js
        run: npm run typecheck

      - name: Test
        working-directory: src/js
        run: npm test

      - name: Build
        working-directory: src/js
        run: npm run build

      - name: Set version
        working-directory: src/js
        # --allow-same-version: the manifest is kept in step with what is published, so the tag's
        # version often already matches. Without this, `npm version` treats a no-op as an error
        # and fails the release.
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: src/js
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-go:
    if: startsWith(github.ref_name, 'src/go/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test
        working-directory: src/go
        run: go test ./... -timeout 60s

      # A Go module is published by its tag — there is no upload step. Fetching it through the
      # proxy is what makes it resolvable and indexes it on pkg.go.dev.
      #
      # The module lives in a subdirectory, so its path is <repo>/src/go and its tags are
      # src/go/vX.Y.Z. Proxy URLs case-escape uppercase letters as !<lower>, so ActionfulClient
      # becomes !actionful!client.
      #
      # Deliberately no `|| true`: a 404 here means the tag produced nothing fetchable, and that
      # must fail the job. The previous version of this step could not fail, and reported success
      # for a module that did not exist.
      - name: Publish to the Go module proxy
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#src/go/v}
          MODULE='github.com/m-quark/!actionful!client/src/go'
          curl -sSf --retry 5 --retry-delay 10 --retry-all-errors "https://proxy.golang.org/${MODULE}/@v/v${VERSION}.info"
          curl -sSf --retry 3 --retry-delay 5 --retry-all-errors "https://sum.golang.org/lookup/${MODULE}@v${VERSION}"

  publish-pypi:
    if: startsWith(github.ref_name, 'pypi-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#pypi-v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: src/python
        run: pip install -e ".[dev]" build

      - name: Test
        working-directory: src/python
        run: python -m pytest tests/

      - name: Set version
        working-directory: src/python
        run: sed -i "s/^version = .*/version = \"${{ steps.version.outputs.VERSION }}\"/" pyproject.toml

      - name: Build
        working-directory: src/python
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: src/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
